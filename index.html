<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Veynt FDC Test</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, sans-serif;

        background: #f5f5f5;
      }

      .container {
        width: 100%;
        max-width: 500px;

        padding: 30px;

        background: white;

        border-radius: 14px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      .description {
        color: #666;
        margin-bottom: 25px;
      }

      label {
        display: block;

        margin-bottom: 7px;

        font-weight: 600;
      }

      select,
      input {
        width: 100%;

        padding: 12px;

        margin-bottom: 18px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 15px;
      }

      button {
        width: 100%;

        padding: 13px;

        border: 0;

        border-radius: 8px;

        background: #111;

        color: white;

        font-size: 16px;

        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;

        cursor: not-allowed;
      }

      .status {
        margin-top: 20px;

        padding: 12px;

        border-radius: 8px;

        background: #f1f1f1;

        white-space: pre-wrap;

        font-size: 14px;
      }

      .warning {
        margin-top: 15px;

        font-size: 12px;

        color: #777;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Veynt FDC Test</h1>

      <div class="description">
        Trigger the FDC test through GitHub Actions.
      </div>

      <!-- TOKEN -->

      <label> Token </label>

      <select id="token">
        <option value="BTC">BTC</option>

        <option value="ETH">ETH</option>

        <option value="SOL">SOL</option>

        <option value="BNB">BNB</option>

        <option value="XRP">XRP</option>

        <option value="ADA">ADA</option>

        <option value="AVAX">AVAX</option>

        <option value="LINK">LINK</option>

        <option value="DOGE">DOGE</option>
      </select>

      <!-- START -->

      <label> Start Time </label>

      <input type="datetime-local" id="startTime" />

      <!-- DEADLINE -->

      <label> Deadline </label>

      <input type="datetime-local" id="deadline" />

      <!-- PAT -->

      <label> GitHub PAT </label>

      <input
        type="password"
        id="pat"
        placeholder="github_pat_..."
        autocomplete="off"
      />

      <button id="triggerButton" onclick="triggerWorkflow()">
        Trigger FDC Test
      </button>

      <div id="status" class="status">Waiting...</div>

      <div class="warning">
        Your PAT is only kept in memory while this page is open. Do not paste it
        into the HTML source or commit it to GitHub.
      </div>
    </div>

    <script>
      async function triggerWorkflow() {
        const token = document.getElementById("token").value;

        const startTimeInput = document.getElementById("startTime").value;

        const deadlineInput = document.getElementById("deadline").value;

        const pat = document.getElementById("pat").value;

        const status = document.getElementById("status");

        const button = document.getElementById("triggerButton");

        if (!startTimeInput) {
          status.textContent = "Please select a start time.";

          return;
        }

        if (!deadlineInput) {
          status.textContent = "Please select a deadline.";

          return;
        }

        if (!pat) {
          status.textContent = "Please enter your GitHub PAT.";

          return;
        }

        const startTime = new Date(startTimeInput).getTime();

        const deadline = new Date(deadlineInput).getTime();

        if (deadline <= startTime) {
          status.textContent = "Deadline must be after start time.";

          return;
        }

        button.disabled = true;

        status.textContent = "Triggering GitHub Actions...";

        try {
          const response = await fetch(
            "https://api.github.com/repos/Pandey456/fdc-trial/actions/workflows/fdc-test.yml/dispatches",
            {
              method: "POST",

              headers: {
                Accept: "application/vnd.github+json",

                Authorization: `Bearer ${pat}`,

                "X-GitHub-Api-Version": "2022-11-28",

                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                ref: "main",

                inputs: {
                  token: token,

                  start_time: String(startTime),

                  deadline: String(deadline),
                },
              }),
            },
          );

          if (!response.ok) {
            const error = await response.text();

            throw new Error(`${response.status}: ${error}`);
          }

          status.textContent = `GitHub Action triggered successfully.

Token: ${token}

Start:
${new Date(startTime).toISOString()}

Deadline:
${new Date(deadline).toISOString()}

Repository:
Pandey456/fdc-trial`;

          /*
           * Clear PAT from the input after use.
           */

          document.getElementById("pat").value = "";
        } catch (error) {
          console.error(error);

          status.textContent =
            "Failed to trigger workflow:\n\n" + error.message;
        } finally {
          button.disabled = false;
        }
      }
    </script>
  </body>
</html>
